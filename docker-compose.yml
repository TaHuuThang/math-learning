# Chạy cả PostgreSQL và THẮNG MATH LEARNING bằng một lệnh:  docker compose up -d
# Sau đó mở http://localhost:3000 – lần đầu sẽ được mời tạo tài khoản quản trị.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: math_learning
      POSTGRES_USER: mathapp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-doi_mat_khau_nay}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathapp -d math_learning"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mathapp:${DB_PASSWORD:-doi_mat_khau_nay}@db:5432/math_learning
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  pgdata:
